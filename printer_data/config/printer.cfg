### For Fly Super 8 V1.3 ####
### And Mellow Kit  ####
### For Fly Super pro 8, the SPI bus is spi1A
### For Fly Super 8 V1.3, the SPI bus is spi3

##### Includes ##########
#########################

[include mainsail.cfg]
[include macros/*.cfg]
[include configs/*.cfg]
[display_status]
[exclude_object]
[virtual_sdcard]
path: ~/printer_data/gcodes
[pause_resume]
recover_velocity: 350

# Enable arcs support for Orcaslicer.
[gcode_arcs]
resolution: 0.1

[force_move]
enable_force_move: True

##### VzBoT ############
########################

[printer]
kinematics: corexy
max_velocity: 2500
max_accel: 10000
#max_accel_to_decel: 5000
max_z_velocity: 20
max_z_accel: 1500
square_corner_velocity: 10

##### MCUs ##############
#########################

#Fly Super 8 Pro
[mcu]
canbus_uuid: 60e580c9c5e0
#restart_method: command

#fly SHT-36 V2
#[mcu sht]      
#canbus_uuid: fd98b5fecf45
#restart_method: command
# run the following command to locate the uuid >   ~/CanBoot/scripts/flash_can.py -i can0 -qwwww

#[mcu Cartographer]
#canbus_uuid: 7e376466cd2f


[idle_timeout]
timeout: 1800
gcode =
  {% if printer.pause_resume.is_paused %}
    M104 S0
  {% else %}
    TURN_OFF_HEATERS
    #M84
  {% endif %}

################################################################################################
##                                        Probe                                               ##
################################################################################################

#[bed_screws]
#screw1: 20,20
#screw2: 20,290
#screw3: 290,290
#screw4: 290,20

################################################################################################
##                                        Homing                                              ##
################################################################################################


[homing_override]
axes: xyz
gcode:
  # 1. Klipper vorgaukeln, wir wären bei Z=0, damit wir uns bewegen dürfen
  SET_KINEMATIC_POSITION Z=0
  
  # 2. Bett um 5mm absenken (relativ) mit sicherer Geschwindigkeit
  G91                           # Relativer Modus
  G1 Z5 F600                    # Z um 5mm runterfahren (Achtung: Beim VZBot bedeutet Z+, dass das Bett nach UNTEN fährt)
  G90                           # Zurück in den absoluten Modus

  # 3. Jetzt ganz normal X und Y homen
  G28 X
  G28 Y

  # 4. Zum Schluss Z homen (hier die Koordinaten der Bettmitte eintragen!)
  # Für ein VZBot 330 Bett (ca. Mitte bei X165 Y165)
  G1 X165 Y165 F6000            # Fahrt zur Bettmitte für den Z-Sensor/Endstopp
  G28 Z
